<script>
(()=>{'use strict';
/* ================= 1. utils ================= */
const $=(s,r=document)=>r.querySelector(s),LS='free_site_studio_v2';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rgb=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return null;const n=parseInt(m[1],16);return [n>>16,n>>8&255,n&255]};
const shade=(h,f)=>{const c=rgb(h);return c?`rgb(${c.map(v=>Math.round(v*f))})`:'rgba(0,0,0,.4)'};
const mix=(a,b,f)=>{const x=rgb(a),y=rgb(b);return x&&y?`rgb(${x.map((v,i)=>Math.round(v*f+y[i]*(1-f)))})`:a};
let uid=0;const nid=()=>'e'+(++uid).toString(36)+Math.random().toString(36).slice(2,6);
const FF={sans:"'Segoe UI',system-ui,Arial,sans-serif",serif:"Georgia,'Times New Roman',serif",round:"'Trebuchet MS',system-ui,sans-serif",mono:"Consolas,'Courier New',monospace",hand:"'Segoe Print','Comic Sans MS',cursive",bold:"Impact,'Arial Black',sans-serif"};
const TXT=['text','btn','icon'];
const FITS=[['cover','Fill (crop)'],['contain','Fit inside'],['stretch','Stretch'],['tile','Repeat']];
const KINDS=[['','Normal (flat)'],['3d','3D raised'],['candy','Glossy candy'],['gradient','Gradient'],['outline','Outline'],['pill','Rounded pill'],['glow','Soft glow'],['neon','Neon outline'],['glass','Glass'],['neu','Soft (neumorphic)'],['retro','Retro hard shadow'],['pressed','Pressed in'],['underline','Underline link']];
const HOVERS=[['','None'],['lift','Lift up'],['grow','Grow'],['glow','Glow'],['dark','Darken']];
const EMO='🏠 🛠️ 🔧 📄 📁 📂 📷 🖼️ 🎨 ✏️ 📝 📞 ✉️ 📍 🕒 💳 💰 🧾 🪪 🖨️ 📱 💻 🌐 🔍 ⭐ ❤️ ✅ ❌ ⚡ 🔒 🔔 📣 🎓 📚 🧮 📊 📈 🛒 🚚 🏥 🏦 🏛️ 🚌 🌾 🍎 ☀️ 🌙 ☁️ 🔥 💡 🎁 🏆 🎯 🚀 👍 👋 😀 😍 🤝 👶 🎮 🧩 ➕ ➡️ ⬅️ ⬆️ ⬇️ ▶️ 🧰 🗂️ 🏷️ ❓ 📌 🔗 🖊️ ✂️'.split(' ');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)};

/* ================= 2. model ================= */
let S,IM={},cur=0,sels=[],z=1,tool='sel',hist=[],redo=[],snapOn=true,pick={m:'add',i:0};
const pg=()=>S.pages[cur],byId=id=>pg().els.find(e=>e.id===id),selAll=()=>sels.map(byId).filter(Boolean),one=()=>sels.length===1?byId(sels[0]):null;
const ne=(t,o)=>({id:nid(),t,x:0,y:0,w:200,h:60,r:0,bg:'',bg2:'#7c3aed',bgi:'',fit:'cover',bs:0,bc:'#13213a',br:0,op:1,sh:0,bk:'',hv:'',tx:'',fs:20,fw:400,fc:'#13213a',al:'left',ff:'sans',lk:0,lnk:'',nm:'',mb:'',...o});
const newPage=(n,h=1400)=>({id:nid(),name:n,w:1280,h,bg:'#ffffff',bgi:'',fit:'cover',rf:true,els:[]});
const slides=()=>[{img:'',bg:'#1a3fa6',tx:'Slide 1'},{img:'',bg:'#0f766e',tx:'Slide 2'},{img:'',bg:'#b45309',tx:'Slide 3'}];
const mkSlider=o=>ne('slider',{w:640,h:320,br:12,au:1,iv:4,ar:1,dt:1,cs:0,nm:'Slider',sl:slides(),...o});
const blank=()=>{IM={};return {title:'My Website',fav:'',pages:[newPage('Home')]}};
function demo(){IM={};const P=newPage('Home',1020),E=P.els,T=(x,y,w,h,tx,o)=>E.push(ne('text',{x,y,w,h,tx,...o}));
 E.push(ne('shape',{w:1280,h:72,bg:'#ffffff',sh:1,nm:'Header bar'}));T(32,16,260,42,'Your Logo',{fs:26,fw:700,fc:'#1a3fa6'});
 [['Home',640],['About',740],['Services',850],['Contact',970]].forEach(a=>T(a[1],22,110,30,a[0],{fs:18,fw:600}));
 E.push(ne('btn',{x:1090,y:12,w:150,h:46,tx:'Sign up',bg:'#f59e0b',fc:'#13213a',br:12,fw:700,al:'center',bk:'3d',hv:'lift'}));
 E.push(ne('shape',{y:72,w:1280,h:430,bg:'#eef2ff',nm:'Hero background'}));
 T(100,150,560,130,'Your big headline goes here',{fs:48,fw:700});T(100,300,520,70,'Tell visitors in one or two lines what your website is about.',{fs:20,fc:'#5b6b82'});
 E.push(ne('btn',{x:100,y:400,w:200,h:56,tx:'Get started',bg:'#1a3fa6',fc:'#ffffff',br:14,fw:700,al:'center',bk:'candy',hv:'lift'}));
 E.push(ne('btn',{x:324,y:400,w:180,h:56,tx:'Learn more',bg:'#e2e8f0',fc:'#13213a',br:10,fw:700,al:'center',hv:'dark'}));
 E.push(mkSlider({x:700,y:120,w:480,h:320,sh:1}));T(100,540,500,50,'What you offer',{fs:32,fw:700});
 [['⭐','Feature one'],['🧰','Feature two'],['💡','Feature three']].forEach((c,i)=>{const x=100+i*370;
  E.push(ne('shape',{x,y:620,w:340,h:200,bg:'#ffffff',bs:1,bc:'#dbe3ee',br:14,sh:1,nm:'Card'}));E.push(ne('icon',{x:x+24,y:640,w:64,h:64,tx:c[0]}));
  T(x+24,720,290,34,c[1],{fs:22,fw:700});T(x+24,760,290,50,'Short text about this feature.',{fs:16,fc:'#5b6b82'})});
 E.push(ne('shape',{y:900,w:1280,h:120,bg:'#0d1526',nm:'Footer'}));T(100,945,800,30,'© Your Website. Move, redraw or delete anything.',{fc:'#cbd5e1',fs:16});
 return {title:'My Website',fav:'',pages:[P]}}

/* ================= 3. styles ================= */
const bgi=(o,R=k=>IM[k])=>{const u=o.bgi?R(o.bgi):'';return u?`background-image:url('${u}');background-position:center;`+(o.fit==='tile'?'background-repeat:repeat;':`background-repeat:no-repeat;background-size:${o.fit==='stretch'?'100% 100%':o.fit};`):''};
const bgCSS=(P,R)=>`background-color:${P.bg};`+bgi(P,R);
const d3=e=>`box-shadow:0 6px 0 ${e.bg?shade(e.bg,.62):'rgba(0,0,0,.4)'},0 12px 18px rgba(0,0,0,.3);`+(e.bgi?'':'background-image:linear-gradient(rgba(255,255,255,.28),rgba(0,0,0,.1));');
function kind(e){const c=e.bg||'#1a3fa6';switch(e.bk){
 case '3d':return d3(e);
 case 'candy':return `background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.08) 50%,rgba(0,0,0,.12) 51%);box-shadow:0 5px 0 ${shade(c,.6)},0 10px 14px rgba(0,0,0,.28);`;
 case 'gradient':return `background-image:linear-gradient(135deg,${c},${e.bg2});`;
 case 'outline':return `background:transparent;border:2px solid ${e.fc};`;
 case 'pill':return `border-radius:${Math.round(e.h/2)}px;`;
 case 'glow':return `box-shadow:0 0 22px 3px ${c},0 0 6px ${c};`;
 case 'neon':return `background:transparent;color:${c};border:2px solid ${c};box-shadow:0 0 12px ${c},inset 0 0 12px ${c};`;
 case 'glass':return 'background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(0,0,0,.15);';
 case 'neu':{const b=mix(c,'#ffffff',.85);return `background:${b};color:${shade(c,.55)};border:0;box-shadow:7px 7px 14px ${shade(b,.8)},-7px -7px 14px #fff;`}
 case 'retro':return 'border:3px solid #111;box-shadow:5px 5px 0 #111;';
 case 'pressed':return 'box-shadow:inset 0 5px 10px rgba(0,0,0,.4);';
 case 'underline':return `background:transparent;border:0;border-bottom:3px solid ${c};border-radius:0;`}return ''}
function sty(e,R,ox=0,oy=0){let s=`left:${e.x-ox}px;top:${e.y-oy}px;width:${e.w}px;height:${e.h}px;opacity:${e.op};`;
 if(e.r)s+=`transform:rotate(${e.r}deg);`;if(e.bg)s+=`background-color:${e.bg};`;s+=bgi(e,R);if(e.bs)s+=`border:${e.bs}px solid ${e.bc};`;
 s+=`border-radius:${e.br>=9999?'50%':e.br+'px'};`;if(e.sh===1)s+='box-shadow:0 6px 18px rgba(0,0,0,.25);';else if(e.sh===2)s+=d3(e);
 if(TXT.includes(e.t)){s+=`color:${e.fc};font-size:${e.t==='icon'?Math.round(Math.min(e.w,e.h)*.72):e.fs}px;font-weight:${e.fw};font-family:${FF[e.ff]};text-align:${e.al};white-space:pre-wrap;line-height:1.25;`;
  s+=e.t==='text'?'padding:4px;':`display:flex;align-items:center;justify-content:${e.t==='icon'?'center':({left:'flex-start',right:'flex-end'})[e.al]||'center'};padding:0 12px;`}
 return s+kind(e)}

/* ================= 4. element markup (editor and export share it) ================= */
const HN=['nw','n','ne','e','se','s','sw','w','rot'];
const svg=e=>`<svg viewBox="0 0 ${e.vw} ${e.vh}" preserveAspectRatio="none" width="100%" height="100%" style="overflow:visible"><path d="${e.d}" fill="none" stroke="${e.sc}" stroke-width="${e.sw}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
function sliderHTML(e,R,ed){const cs=ed?e.cs||0:0;
 return `<div class="track">${e.sl.map((s,i)=>`<div class="sl${i===cs?' on':''}" style="${s.bg?`background-color:${s.bg};`:''}${bgi({bgi:s.img,fit:e.fit},R)}"><span class="cap">${esc(s.tx)}</span></div>`).join('')}</div>`+
